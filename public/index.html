<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AppABUOA AI</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 20px;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .subtitulo {
      color: #94a3b8;
      font-size: 20px;
      margin-bottom: 40px;
    }

    .creator {
      background: #1e293b;
      padding: 25px;
      border-radius: 16px;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      box-sizing: border-box;
      padding: 18px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 17px;
      resize: vertical;
    }

    button {
      margin-top: 18px;
      padding: 14px 30px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #resultado {
      margin-top: 25px;
      padding: 20px;
      background: #0f172a;
      border-radius: 10px;
      text-align: left;
      white-space: pre-wrap;
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>AppABUOA AI</h1>

    <div class="subtitulo">
      Transforme suas ideias em aplicativos com inteligência artificial.
    </div>

    <div class="creator">

      <textarea
        id="prompt"
        placeholder="Descreva o aplicativo que você deseja criar..."
      ></textarea>

      <button onclick="criarApp()">
        Criar com IA
      </button>

      <div id="resultado"></div>

    </div>

  </div>

  <script>
    async function criarApp() {

      const prompt = document.getElementById("prompt").value;
      const resultado = document.getElementById("resultado");

      if (!prompt.trim()) {
        alert("Descreva primeiro o aplicativo que deseja criar.");
        return;
      }

      resultado.style.display = "block";
      resultado.textContent = "A inteligência artificial está trabalhando...";

      try {

        const resposta = await fetch("/api/ai", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ prompt })
        });

        const dados = await resposta.json();

        if (!resposta.ok || !dados.success) {
          throw new Error(dados.error || "Erro ao consultar a IA.");
        }

        resultado.innerHTML = `
  <div style="margin-bottom: 18px;">
    ${dados.answer}
  </div>

  ${
    dados.projeto
      ? `
        <a
          href="/apps/${dados.projeto}/"
          target="_blank"
          style="
            display: inline-block;
            padding: 14px 24px;
            background: #16a34a;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
          "
        >
          👁 Visualizar aplicativo
        </a>
      `
      : ""
  }
`;

      } catch (erro) {

        resultado.textContent =
          "Não foi possível gerar o aplicativo: " + erro.message;

      }
    }
  </script>

</body>
</html>
