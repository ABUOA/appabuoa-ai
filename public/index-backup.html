<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AppABUOA AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #ffffff;
    }

    .container {
      max-width: 1500px;
      margin: 0 auto;
      padding: 36px 20px 60px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 48px;
      text-align: center;
    }

    .subtitulo {
      margin-bottom: 36px;
      text-align: center;
      color: #94a3b8;
      font-size: 20px;
    }

    .creator {
      max-width: 1000px;
      margin: 0 auto;
      padding: 25px;
      background: #1e293b;
      border-radius: 16px;
      text-align: center;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      padding: 18px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #0f172a;
      color: #ffffff;
      font-size: 16px;
      resize: vertical;
    }

    button {
      margin-top: 14px;
      padding: 12px 20px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #resultado {
      display: none;
      margin-top: 22px;
      padding: 18px;
      border-radius: 10px;
      background: #0f172a;
      text-align: left;
    }

    #meusApps {
      margin-top: 38px;
    }

    .app-card {
      margin-bottom: 20px;
      padding: 18px;
      border: 1px solid #334155;
      border-radius: 14px;
      background: #1e293b;
    }

    .app-title {
      font-size: 19px;
      font-weight: bold;
    }

    .app-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .app-card.active-project {
      border-color: #22c55e;
      box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.35);
    }

    .active-project-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
      margin-bottom: 4px;
      padding: 12px 14px;
      border: 1px solid #22c55e;
      border-radius: 10px;
      background: rgba(20, 83, 45, 0.65);
      color: #dcfce7;
      font-weight: bold;
    }

    .active-project-banner .project-name {
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .active-project-banner button {
      margin: 0;
      padding: 8px 12px;
      background: #475569;
      font-size: 13px;
    }

    .workspace {
      display: grid;
      grid-template-columns: 470px 1fr;
      gap: 18px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #334155;
      align-items: start;
    }

    .left-column {
      display: grid;
      gap: 16px;
    }

    .panel {
      padding: 16px;
      border: 1px solid #334155;
      border-radius: 14px;
      background: #0f172a;
    }

    .panel h3 {
      margin-top: 0;
    }

    .muted {
      color: #94a3b8;
    }

    .editor-status {
      margin-top: 15px;
      color: #cbd5e1;
    }

    .preview-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .preview-toolbar button {
      margin-top: 0;
      padding: 10px 14px;
      font-size: 14px;
    }

    .preview-box {
      min-height: 680px;
      padding: 12px;
      overflow: auto;
      border: 1px solid #334155;
      border-radius: 12px;
      background: #020617;
    }

    .preview-frame-wrap {
      width: 100%;
      margin: 0 auto;
      transition: width 0.2s ease;
    }

    .preview-frame {
      display: block;
      width: 100%;
      height: 650px;
      border: 0;
      border-radius: 8px;
      background: #ffffff;
    }

    .new-file-box {
      margin: 14px 0 12px;
      padding: 12px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #111827;
    }

    .new-file-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .new-file-row input {
      flex: 1;
      min-width: 190px;
      padding: 10px 12px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #020617;
      color: #ffffff;
    }

    .new-file-row button {
      margin-top: 0;
      background: #2563eb;
    }

    .new-file-status {
      margin-top: 9px;
      min-height: 18px;
      font-size: 13px;
    }

    .files-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .file-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 7px;
      align-items: stretch;
    }

    .file-row .file-button {
      min-width: 0;
    }

    .file-action {
      margin: 0;
      padding: 10px 12px;
      min-width: 44px;
    }

    .file-button {
      width: 100%;
      margin: 0;
      padding: 11px 12px;
      text-align: left;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
    }

    .file-button:hover {
      background: #334155;
    }

    .file-button.active {
      border-color: #3b82f6;
      background: #1d4ed8;
    }

    .code-panel {
      margin-top: 14px;
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }

    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .search-row input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #020617;
      color: #fff;
    }

    .search-row button {
      margin-top: 0;
      padding: 10px 14px;
    }

    .code-editor-wrapper {
      display: grid;
      grid-template-columns: auto 1fr;
      min-height: 430px;
      max-height: 620px;
      overflow: hidden;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #020617;
    }

    .line-numbers {
      min-width: 48px;
      padding: 14px 10px;
      overflow: hidden;
      border-right: 1px solid #334155;
      background: #111827;
      color: #64748b;
      text-align: right;
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
      line-height: 1.5;
      user-select: none;
      white-space: pre;
    }

    .code-editor {
      width: 100%;
      min-height: 430px;
      max-height: 620px;
      margin: 0;
      padding: 14px;
      overflow: auto;
      border: 0;
      outline: none;
      border-radius: 0;
      background: #020617;
      color: #e2e8f0;
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
      line-height: 1.5;
      resize: vertical;
      tab-size: 2;
      white-space: pre;
    }

    .code-editor:focus {
      box-shadow: inset 0 0 0 1px #3b82f6;
    }

    .save-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .save-actions button {
      margin-top: 0;
    }

    .file-status {
      margin-top: 12px;
      min-height: 20px;
      font-size: 14px;
    }

    .unsaved {
      color: #fbbf24;
      font-weight: bold;
    }

    .saved {
      color: #4ade80;
      font-weight: bold;
    }

    .error {
      color: #f87171;
      font-weight: bold;
    }

    .history-area {
      margin-top: 18px;
    }

    .history-card {
      margin-top: 10px;
      padding: 14px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #0f172a;
    }

    .success-box {
      margin-top: 15px;
      margin-bottom: 15px;
      padding: 18px;
      border: 1px solid #22c55e;
      border-radius: 10px;
      background: #14532d;
    }

    @media (max-width: 1100px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .preview-box {
        min-height: 560px;
      }

      .preview-frame {
        height: 540px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>AppABUOA AI</h1>

    <div class="subtitulo">
      Transforme suas ideias em aplicativos com inteligência artificial.
    </div>

    <div class="creator">

      <textarea
        id="prompt"
        placeholder="Descreva o aplicativo que você deseja criar..."
      ></textarea>

      <button onclick="criarApp()">
        Criar com IA
      </button>

      <div id="resultado"></div>

    </div>

    <div id="meusApps"></div>

  </div>

  <script>

    const arquivosAbertos = {};
    const conteudosOriginais = {};
    let projetoAtivo = null;
    const planosPendentes = {};


    async function criarApp() {
      const prompt =
        document.getElementById("prompt").value;

      const resultado =
        document.getElementById("resultado");

      if (!prompt.trim()) {
        alert("Descreva primeiro o aplicativo que deseja criar.");
        return;
      }

      resultado.style.display = "block";
      resultado.textContent =
        "✨ A inteligência artificial está trabalhando...";

      try {
        const resposta = await fetch("/api/ai", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ prompt })
        });

        const dados = await resposta.json();

        if (!resposta.ok || !dados.success) {
          throw new Error(
            dados.error || "Erro ao consultar a IA."
          );
        }

        resultado.innerHTML = `
          <strong>✅ Aplicativo criado com sucesso.</strong>
          <p>${dados.answer}</p>
          <p>
            Projeto:
            <strong>${dados.projeto}</strong>
          </p>
        `;

        await carregarApps();

      } catch (erro) {
        resultado.textContent =
          "❌ Não foi possível gerar o aplicativo: " +
          erro.message;
      }
    }



    async function duplicarProjetoInterface(projeto) {
      if (
        projetoAtivo &&
        projetoAtivo !== projeto &&
        existeAlteracaoNaoSalvaNoProjeto(projetoAtivo)
      ) {
        alert(
          "Existe outro projeto com alterações não salvas. Salve ou desfaça antes de duplicar."
        );
        return;
      }

      if (
        projetoAtivo === projeto &&
        existeAlteracaoNaoSalvaNoProjeto(projeto)
      ) {
        alert(
          "Este projeto possui alterações não salvas. Salve ou desfaça antes de duplicar."
        );
        return;
      }

      const novoNome =
        window.prompt(
          "Digite o nome do novo projeto:",
          projeto + "-copia"
        );

      if (
        novoNome === null ||
        !novoNome.trim()
      ) {
        return;
      }

      try {
        const resposta =
          await fetch(
            `/api/apps/${projeto}/duplicate`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                novoNome:
                  novoNome.trim()
              })
            }
          );

        const dados =
          await resposta.json();

        if (!resposta.ok || !dados.success) {
          throw new Error(
            dados.error ||
            "Erro ao duplicar projeto."
          );
        }

        alert(
          `✅ Projeto duplicado com sucesso.\n\nOriginal: ${dados.projetoOriginal}\nNova cópia: ${dados.projeto}\nArquivos copiados: ${dados.quantidadeArquivos}`
        );

        await carregarApps();

      } catch (erro) {
        alert(
          "❌ Não foi possível duplicar o projeto: " +
          erro.message
        );
      }
    }


    async function renomearProjetoInterface(projeto) {
      if (
        projetoAtivo === projeto &&
        existeAlteracaoNaoSalvaNoProjeto(projeto)
      ) {
        alert(
          "Este projeto possui alterações não salvas. Salve ou desfaça antes de renomear."
        );
        return;
      }

      const novoNome =
        window.prompt(
          "Digite o novo nome do projeto:",
          projeto
        );

      if (
        novoNome === null ||
        !novoNome.trim() ||
        novoNome.trim() === projeto
      ) {
        return;
      }

      try {
        const resposta =
          await fetch(
            `/api/apps/${projeto}/rename`,
            {
              method: "PATCH",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                novoNome:
                  novoNome.trim()
              })
            }
          );

        const dados =
          await resposta.json();

        if (!resposta.ok || !dados.success) {
          throw new Error(
            dados.error ||
            "Erro ao renomear projeto."
          );
        }

        if (projetoAtivo === projeto) {
          projetoAtivo = null;
        }

        alert(
          `✅ Projeto renomeado com sucesso.\n\nAnterior: ${dados.projetoAnterior}\nNovo nome: ${dados.projeto}\nArquivos: ${dados.quantidadeArquivos}`
        );

        await carregarApps();

      } catch (erro) {
        alert(
          "❌ Não foi possível renomear o projeto: " +
          erro.message
        );
      }
    }


    async function excluirProjetoInterface(projeto) {
      if (
        projetoAtivo === projeto &&
        existeAlteracaoNaoSalvaNoProjeto(projeto)
      ) {
        alert(
          "Este projeto possui alterações não salvas. Salve ou desfaça antes de excluir."
        );
        return;
      }

      const confirmar =
        window.confirm(
          `Excluir definitivamente o projeto "${projeto}"?\n\nUm backup completo será criado automaticamente antes da exclusão.`
        );

      if (!confirmar) {
        return;
      }

      try {
        const resposta =
          await fetch(
            `/api/apps/${projeto}/delete`,
            {
              method: "DELETE"
            }
          );

        const dados =
          await resposta.json();

        if (!resposta.ok || !dados.success) {
          throw new Error(
            dados.error ||
            "Erro ao excluir projeto."
          );
        }

        if (projetoAtivo === projeto) {
          projetoAtivo = null;
        }

        alert(
          `✅ Projeto excluído com sucesso.\n\nProjeto: ${dados.projeto}\nArquivos removidos: ${dados.quantidadeArquivos}\nBackup: ${dados.backup}`
        );

        await carregarApps();

      } catch (erro) {
        alert(
          "❌ Não foi possível excluir o projeto: " +
          erro.message
        );
      }
    }


    function baixarProjetoZip(projeto) {
      const url =
        `/api/apps/${encodeURIComponent(projeto)}/download`;

      window.location.href = url;
    }

    function visualizarApp(projeto) {
      window.open(
        `/apps/${projeto}/`,
        "_blank"
      );
    }


    async function carregarApps() {
      const area =
        document.getElementById("meusApps");

      try {
        const resposta =
          await fetch("/api/apps");

        const dados =
          await resposta.json();

        if (!resposta.ok || !dados.success) {
          throw new Error(
            dados.error ||
            "Não foi possível carregar os aplicativos."
          );
        }

        if (!dados.apps.length) {
          area.innerHTML = "";
          return;
        }

        area.innerHTML = `
          <h2>Meus Aplicativos</h2>

          ${dados.apps.map(app => `
            <div class="app-card" id="app-card-${app.nome}">

              <div class="app-title">
                ${app.nome}
              </div>

              <div class="app-actions">

                <button
                  onclick="abrirWorkspace('${app.nome}')"
                >
                  🧩 Abrir editor
                </button>

                <button
                  onclick="visualizarApp('${app.nome}')"
                  style="background:#16a34a;"
                >
                  ↗ Abrir em nova aba
                </button>

                <button
                  onclick="carregarHistorico('${app.nome}')"
                  style="background:#0f766e;"
                >
                  🕘 Histórico de versões
                </button>
                <button
                  onclick="duplicarProjetoInterface('${app.nome}')"
                  style="background:#d97706;"
                >
                  &#128209; Duplicar projeto
                </button>
                <button
                  onclick="renomearProjetoInterface('${app.nome}')"
                  style="background:#2563eb;"
                >
                  ✏️ Renomear projeto
                </button>
                <button
                  onclick="excluirProjetoInterface('${app.nome}')"
                  style="background:#dc2626;"
                >
                  🗑️ Excluir projeto
                </button>
                <button
                  onclick="baixarProjetoZip('${app.nome}')"
                  style="background:#7c3aed;"
                >
                  📦 Baixar ZIP
                </button>
                <button
                  onclick="carregarHistoricoIA('${app.nome}')"
                  style="background:#0891b2;"
                >
                  🤖 Histórico da IA
                </button>

              </div>

              <div id="workspace-${app.nome}"></div>
              <div id="historico-${app.nome}"></div>
              <div id="historico-ia-${app.nome}"></div>

            </div>
          `).join("")}
        `;

      } catch (erro) {
        area.innerHTML =
          "❌ Não foi possível carregar os aplicativos: " +
          erro.message;
      }
    }


    function existeAlteracaoNaoSalvaNoProjeto(projeto) {
      if (!projeto) {
        return false;
      }

      const codigo =
        document.getElementById(
          `codigo-${projeto}`
        );

      if (!codigo) {
        return false;
      }

      return (
        arquivosAbertos[projeto] &&
        codigo.value !==
          conteudosOriginais[projeto]
      );
    }


    function fecharWorkspace(projeto) {
      if (!projeto) {
        return;
      }

      const area =
        document.getElementById(
          `workspace-${projeto}`
        );

      if (area) {
        area.innerHTML = "";
      }

      const card =
        document.getElementById(
          `app-card-${projeto}`
        );

      if (card) {
        card.classList.remove(
          "active-project"
        );
      }

      if (projetoAtivo === projeto) {
        projetoAtivo = null;
      }
    }


    function fecharProjetoAtivo() {
      if (!projetoAtivo) {
        return;
      }

      if (
        existeAlteracaoNaoSalvaNoProjeto(
          projetoAtivo
        )
      ) {
        alert(
          "Existe um arquivo com alterações não salvas. Salve ou desfaça antes de fechar o editor."
        );
        return;
      }

      fecharWorkspace(projetoAtivo);
    }


    function abrirWorkspace(projeto) {
      if (
        projetoAtivo &&
        projetoAtivo !== projeto
      ) {
        if (
          existeAlteracaoNaoSalvaNoProjeto(
            projetoAtivo
          )
        ) {
          alert(
            `O projeto ${projetoAtivo} possui alterações não salvas.\n\nSalve ou desfaça essas alterações antes de abrir outro projeto.`
          );
          return;
        }

        fecharWorkspace(
          projetoAtivo
        );
      }

      const area =
        document.getElementById(
          `workspace-${projeto}`
        );

      if (!area) {
        return;
      }

      projetoAtivo = projeto;

      document
        .querySelectorAll(
          ".app-card.active-project"
        )
        .forEach(card => {
          card.classList.remove(
            "active-project"
          );
        });

      const card =
        document.getElementById(
          `app-card-${projeto}`
        );

      if (card) {
        card.classList.add(
          "active-project"
        );
      }

      area.innerHTML = `
        <div class="active-project-banner">
          <span>
            🟢 EDITANDO AGORA:
            <span class="project-name">
              ${projeto}
            </span>
          </span>

          <button
            onclick="fecharProjetoAtivo()"
            title="Fechar editor deste projeto"
          >
            ✕ Fechar editor
          </button>
        </div>

        <div class="workspace">

          <div class="left-column">

            <div class="panel">

              <h3>
                ✨ Editor com IA — ${projeto}
              </h3>

              <p class="muted">
                Descreva o que deseja alterar neste aplicativo.
              </p>

              <textarea
                id="pedido-${projeto}"
                placeholder="Exemplo: adicione login, troque as cores, crie uma tela de cadastro..."
              ></textarea>

                            <button
                onclick="gerarPlanoIA('${projeto}')"
                style="background:#7c3aed;"
              >
                🧠 Gerar plano
              </button>

              <div
                id="resultado-${projeto}"
                class="editor-status"
              ></div>

              <div
                id="plano-container-${projeto}"
                style="display:none; margin-top:14px;"
              >
                <div
                  id="plano-conteudo-${projeto}"
                  class="panel"
                ></div>

                <div
                  class="app-actions"
                >
                  <button
                    id="aprovar-plano-${projeto}"
                    onclick="aprovarPlanoIA('${projeto}')"
                    style="background:#16a34a;"
                  >
                    ✅ Aprovar e aplicar
                  </button>

                  <button
                    onclick="cancelarPlanoIA('${projeto}')"
                    style="background:#dc2626;"
                  >
                    ❌ Cancelar
                  </button>
                </div>
              </div>

            </div>


            <div class="panel">

              <h3>
                📁 Arquivos do projeto — ${projeto}
              </h3>

              <p class="muted">
                Clique em um arquivo para abrir e editar.
              </p>

              <div class="new-file-box">
                <div class="new-file-row">
                  <input
                    id="novo-arquivo-${projeto}"
                    type="text"
                    placeholder="Ex.: login.html ou js/config.js"
                    onkeydown="
                      if(event.key === 'Enter') {
                        criarNovoArquivo('${projeto}');
                      }
                    "
                  >
                  <button onclick="criarNovoArquivo('${projeto}')">

    async function criarNovoArquivo(projeto) {
      const campo = document.getElementById(`novo-arquivo-${projeto}`);
      const status = document.getElementById(`novo-arquivo-status-${projeto}`);

      if (!campo || !status) return;

      const caminho = campo.value.trim().replace(/**\\\**/g, "/");

      if (!caminho) {
        status.innerHTML = '<span class="error">❌ Informe o nome do arquivo.</span>';
        campo.focus();
        return;
      }

      if (caminho.startsWith("/") || caminho === ".." || caminho.includes("../")) {
        status.innerHTML = '<span class="error">❌ Caminho de arquivo inválido.</span>';
        campo.focus();
        return;
      }

      if (houveAlteracao(projeto)) {
        alert("Existe um arquivo com alterações não salvas. Salve ou desfaça antes de criar outro arquivo.");
        return;
      }

      status.textContent = "➕ Criando arquivo e backup de segurança...";

      try {
        const resposta = await fetch(`/api/apps/${projeto}/file`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            path: caminho,
            content: ""
          })
        });

        const dados = await resposta.json();

        if (!resposta.ok || !dados.success) {
          throw new Error(dados.error || "Erro ao criar arquivo.");
        }

        campo.value = "";

        status.innerHTML = `
          <span class="saved">
            ✅ ${dados.arquivo} criado. Backup: ${dados.backup}
          </span>
        `;

        await carregarArquivos(projeto);

        arquivosAbertos[projeto] = null;
        conteudosOriginais[projeto] = null;

        await abrirArquivo(
          projeto,
          encodeURIComponent(dados.arquivo)
        );

      } catch (erro) {
        status.innerHTML = `<span class="error">❌ ${erro.message}</span>`;
      }
    }


    async function carregarArquivos(projeto) {
      const area =
        document.getElementById(
          `arquivos-${projeto}`
        );

      try {
        const resposta =
          await fetch(
            `/api/apps/${projeto}/files`
          );

        const dados =
          await resposta.json();

        if (!resposta.ok || !dados.success) {
          throw new Error(
            dados.error ||
            "Erro ao carregar arquivos."
          );
        }

        if (!dados.arquivos.length) {
          area.innerHTML =
            '<span class="muted">Nenhum arquivo encontrado.</span>';
          return;
        }

        area.innerHTML =
          dados.arquivos.map(arquivo => {
            const protegido =
              arquivo.path === "index.html";

            return `
              <div class="file-row">

                <button
                  class="file-button"
                  onclick="abrirArquivo(
                    '${projeto}',
                    '${encodeURIComponent(arquivo.path)}'
                  )"
                >
                  ${iconeArquivo(arquivo.path)}
                  ${arquivo.path}
                </button>

                <button
                  class="file-action"
                  style="background:${protegido ? "#475569" : "#d97706"};"
                  ${protegido ? "disabled" : ""}
                  title="${protegido ? "index.html é protegido" : "Renomear arquivo"}"
                  onclick="renomearArquivo(
                    '${projeto}',
                    '${encodeURIComponent(arquivo.path)}'
                  )"
                >
                  ✏️
                </button>

                <button
                  class="file-action"
                  style="background:${protegido ? "#475569" : "#dc2626"};"
                  ${protegido ? "disabled" : ""}
                  title="${protegido ? "index.html é protegido" : "Excluir arquivo"}"
                  onclick="excluirArquivo(
                    '${projeto}',
                    '${encodeURIComponent(arquivo.path)}'
                  )"
                >
                  🗑️
                </button>

              </div>
            `;
          }).join("");

      } catch (erro) {
        area.innerHTML =
          "❌ Não foi possível carregar os arquivos: " +
          erro.message;
      }
    }


    async function renomearArquivo(
      projeto,
      caminhoCodificado
    ) {
      const caminhoAtual =
        decodeURIComponent(
          caminhoCodificado
        );

      if (caminhoAtual === "index.html") {
        alert(
          "O index.html é protegido e não pode ser renomeado."
        );
        return;
      }

      if (houveAlteracao(projeto)) {
        alert(
          "Existe um arquivo com alterações não salvas. Salve ou desfaça antes de renomear."
        );
        return;
      }

      const novoCaminho =
        window.prompt(
          "Digite o novo nome ou caminho do arquivo:",
          caminhoAtual
        );

      if (
        novoCaminho === null ||
        !novoCaminho.trim() ||
        novoCaminho.trim() === caminhoAtual
      ) {
        return;
      }

      try {
        const resposta =
          await fetch(
            `/api/apps/${projeto}/file`,
            {
              method: "PATCH",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                path: caminhoAtual,
                newPath: novoCaminho.trim()
              })
            }
          );

        const dados =
          await resposta.json();

        if (!resposta.ok || !dados.success) {
          throw new Error(
            dados.error ||
            "Erro ao renomear arquivo."
          );
        }

        const estavaAberto =
          arquivosAbertos[projeto] ===
          caminhoAtual;

        await carregarArquivos(projeto);

        if (estavaAberto) {
          arquivosAbertos[projeto] = null;
          conteudosOriginais[projeto] = null;

          await abrirArquivo(
            projeto,
            encodeURIComponent(
              dados.arquivo
            )
          );
        }

        atualizarPreview(projeto);

        alert(
          `✅ Arquivo renomeado com sucesso.\n\n${dados.arquivoAnterior} → ${dados.arquivo}\nBackup: ${dados.backup}`
        );

      } catch (erro) {
        alert(
          "❌ Não foi possível renomear: " +
          erro.message
        );
      }
    }


    async function excluirArquivo(
      projeto,
      caminhoCodificado
    ) {
      const caminho =
        decodeURIComponent(
          caminhoCodificado
        );

      if (caminho === "index.html") {
        alert(
          "O index.html é protegido e não pode ser excluído."
        );
        return;
      }

      if (houveAlteracao(projeto)) {
        alert(
          "Existe um arquivo com alterações não salvas. Salve ou desfaça antes de excluir."
        );
        return;
      }

      const confirmar =
        window.confirm(
          `Excluir definitivamente "${caminho}"?\n\nUma versão de segurança será criada automaticamente antes da exclusão.`
        );

      if (!confirmar) {
        return;
      }

      try {
        const resposta =
          await fetch(
            `/api/apps/${projeto}/file?path=${encodeURIComponent(caminho)}`,
            {
              method: "DELETE"
            }
          );

        const dados =
          await resposta.json();

        if (!resposta.ok || !dados.success) {
          throw new Error(
            dados.error ||
            "Erro ao excluir arquivo."
          );
        }

        if (
          arquivosAbertos[projeto] ===
          caminho
        ) {
          arquivosAbertos[projeto] = null;
          conteudosOriginais[projeto] = null;

          const container =
            document.getElementById(
              `codigo-container-${projeto}`
            );

          if (container) {
            container.style.display =
              "none";
          }
        }

        await carregarArquivos(projeto);
        atualizarPreview(projeto);

        alert(
          `✅ Arquivo excluído com sucesso.\n\nArquivo: ${dados.arquivo}\nBackup: ${dados.backup}`
        );

      } catch (erro) {
        alert(
          "❌ Não foi possível excluir: " +
          erro.message
        );
      }
    }


    function iconeArquivo(caminho) {
      if (caminho.endsWith(".html")) {
        return "📄";
      }

      if (caminho.endsWith(".css")) {
        return "🎨";
      }

      if (caminho.endsWith(".js")) {
        return "⚙️";
      }

      if (caminho.endsWith(".json")) {
        return "🧾";
      }

      return "📄";
    }


    async function abrirArquivo(
      projeto,
      caminhoCodificado
    ) {
      const caminho =
        decodeURIComponent(caminhoCodificado);

      if (
        arquivosAbertos[projeto] &&
        houveAlteracao(projeto)
      ) {
        const continuar =
          confirm(
            "Existem alterações não salvas.\n\nDeseja descartá-las e abrir outro arquivo?"
          );

        if (!continuar) {
          return;
        }
      }

      const container =
        document.getElementById(
          `codigo-container-${projeto}`
        );

      const nome =
        document.getElementById(
          `codigo-nome-${projeto}`
        );

      const codigo =
        document.getElementById(
          `codigo-${projeto}`
        );

      const status =
        document.getElementById(
          `status-arquivo-${projeto}`
        );

      container.style.display = "block";

      nome.textContent =
        "📄 " + caminho;

      codigo.value =
        "Carregando código...";

      codigo.disabled = true;
      status.textContent = "";

      try {
        const resposta =
          await fetch(
            `/api/apps/${projeto}/file?path=${encodeURIComponent(caminho)}`
          );

        const dados =
          await resposta.json();

        if (!resposta.ok || !dados.success) {
          throw new Error(
            dados.error ||
            "Erro ao ler arquivo."
          );
        }

        arquivosAbertos[projeto] =
          dados.path;

        conteudosOriginais[projeto] =
          dados.content;

        nome.textContent =
          `${iconeArquivo(dados.path)} ${dados.path}`;

        codigo.value =
          dados.content;

        codigo.disabled = false;

        atualizarLinhas(projeto);
        marcarComoSalvo(projeto);

      } catch (erro) {
        codigo.value = "";
        codigo.disabled = true;

        status.innerHTML =
          `<span class="error">❌ ${erro.message}</span>`;
      }
    }


    function atualizarLinhas(projeto) {
      const codigo =
        document.getElementById(
          `codigo-${projeto}`
        );

      const linhas =
        document.getElementById(
          `linhas-${projeto}`
        );

      if (!codigo || !linhas) {
        return;
      }

      const quantidade =
        codigo.value.split("\n").length;

      let numeros = "";

      for (
        let i = 1;
        i <= quantidade;
        i++
      ) {
        numeros += i + "\n";
      }

      linhas.textContent = numeros;
    }


    function sincronizarScroll(projeto) {
      const codigo =
        document.getElementById(
          `codigo-${projeto}`
        );

      const linhas =
        document.getElementById(
          `linhas-${projeto}`
        );

      if (!codigo || !linhas) {
        return;
      }

      linhas.scrollTop =
        codigo.scrollTop;
    }


    function houveAlteracao(projeto) {
      const codigo =
        document.getElementById(
          `codigo-${projeto}`
        );

      if (!codigo) {
        return false;
      }

      return (
        codigo.value !==
        conteudosOriginais[projeto]
      );
    }


    function marcarAlteracao(projeto) {
      const indicador =
        document.getElementById(
          `alteracao-${projeto}`
        );

      if (!indicador) {
        return;
      }

      if (houveAlteracao(projeto)) {
        indicador.innerHTML =
          '<span class="unsaved">● Não salvo</span>';
      } else {
        indicador.innerHTML =
          '<span class="saved">✓ Salvo</span>';
      }
    }


    function marcarComoSalvo(projeto) {
      const indicador =
        document.getElementById(
          `alteracao-${projeto}`
        );

      if (indicador) {
        indicador.innerHTML =
          '<span class="saved">✓ Salvo</span>';
      }
    }


    function buscarNoCodigo(projeto) {
      const campo =
        document.getElementById(
          `buscar-${projeto}`
        );

      const codigo =
        document.getElementById(
          `codigo-${projeto}`
        );

      if (!campo || !codigo) {
        return;
      }

      const termo =
        campo.value;

      if (!termo) {
        return;
      }

      const texto =
        codigo.value;

      const inicio =
        codigo.selectionEnd || 0;

      let indice =
        texto.indexOf(
          termo,
          inicio
        );

      if (indice === -1) {
        indice =
          texto.indexOf(termo);
      }

      if (indice === -1) {
        alert(
          `Não encontrei "${termo}" neste arquivo.`
        );
        return;
      }

      codigo.focus();

      codigo.setSelectionRange(
        indice,
        indice + termo.length
      );
    }


    function desfazerAlteracao(projeto) {
      const codigo =
        document.getElementById(
          `codigo-${projeto}`
        );

      if (!codigo) {
        return;
      }

      if (!houveAlteracao(projeto)) {
        return;
      }

      const confirmar =
        window.confirm(
          "Deseja descartar as alterações não salvas?"
        );

      if (!confirmar) {
        return;
      }

      codigo.value =
        conteudosOriginais[projeto] || "";

      atualizarLinhas(projeto);
      marcarComoSalvo(projeto);

      const status =
        document.getElementById(
          `status-arquivo-${projeto}`
        );

      status.textContent =
        "Alterações descartadas.";
    }


    async function salvarArquivo(projeto) {
      const caminho =
        arquivosAbertos[projeto];

      const codigo =
        document.getElementById(
          `codigo-${projeto}`
        );

      const status =
        document.getElementById(
          `status-arquivo-${projeto}`
        );

      const botao =
        document.getElementById(
          `salvar-${projeto}`
        );

      if (!caminho) {
        alert(
          "Selecione primeiro um arquivo."
        );
        return;
      }

      if (!houveAlteracao(projeto)) {
        status.innerHTML =
          '<span class="saved">✓ Nenhuma alteração para salvar.</span>';
        return;
      }

      const confirmar =
        window.confirm(
          `Salvar alterações em ${caminho}?\n\nUma versão de segurança será criada automaticamente.`
        );

      if (!confirmar) {
        return;
      }

      botao.disabled = true;

      status.textContent =
        "💾 Salvando e criando backup...";

      try {
        const resposta =
          await fetch(
            `/api/apps/${projeto}/file`,
            {
              method: "PUT",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                path: caminho,
                content: codigo.value
              })
            }
          );

        const dados =
          await resposta.json();

        if (!resposta.ok || !dados.success) {
          throw new Error(
            dados.error ||
            "Erro ao salvar arquivo."
          );
        }

        conteudosOriginais[projeto] =
          codigo.value;

        marcarComoSalvo(projeto);

        status.innerHTML = `
          <div class="success-box">

            <strong>
              ✅ Arquivo salvo com sucesso!
            </strong>

            <p>
              Arquivo:
              <strong>${dados.arquivo}</strong>
            </p>

            <p>
              Backup criado:
              <strong>${dados.backup}</strong>
            </p>

          </div>
        `;

        atualizarPreview(projeto);

      } catch (erro) {
        status.innerHTML =
          `<span class="error">❌ ${erro.message}</span>`;

      } finally {
        botao.disabled = false;
      }
    }


    function mudarPreview(
      projeto,
      tipo
    ) {
      const wrap =
        document.getElementById(
          `preview-wrap-${projeto}`
        );

      if (!wrap) {
        return;
      }

      if (tipo === "desktop") {
        wrap.style.width = "100%";
      }

      if (tipo === "tablet") {
        wrap.style.width = "768px";
        wrap.style.maxWidth = "100%";
      }

      if (tipo === "mobile") {
        wrap.style.width = "390px";
        wrap.style.maxWidth = "100%";
      }
    }


    function atualizarPreview(projeto) {
      const frame =
        document.getElementById(
          `preview-frame-${projeto}`
        );

      if (!frame) {
        return;
      }

      frame.src =
        `/apps/${projeto}/?t=${Date.now()}`;
    }



    function escaparHtml(texto) {
      return String(texto ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    async function gerarPlanoIA(projeto) {
      if (projetoAtivo !== projeto) {
        alert(
          "Este projeto nao esta ativo no editor."
        );
        return;
      }

      const pedidoCampo =
        document.getElementById(
          `pedido-${projeto}`
        );

      const resultado =
        document.getElementById(
          `resultado-${projeto}`
        );

      const planoContainer =
        document.getElementById(
          `plano-container-${projeto}`
        );

      const planoConteudo =
        document.getElementById(
          `plano-conteudo-${projeto}`
        );

      const pedido =
        pedidoCampo
          ? pedidoCampo.value.trim()
          : "";

      if (!pedido) {
        alert(
          "Descreva a alteracao desejada."
        );
        return;
      }

      if (houveAlteracao(projeto)) {
        alert(
          "Existe um arquivo com alteracoes nao salvas. Salve ou desfaça antes de gerar o plano."
        );
        return;
      }

      resultado.innerHTML =
        "🧠 A IA esta analisando o projeto e criando o plano...";

      if (planoContainer) {
        planoContainer.style.display =
          "none";
      }

      try {
        const resposta =
          await fetch(
            "/api/edit/plan",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body: JSON.stringify({
                projeto,
                pedido
              })
            }
          );

        const dados =
          await resposta.json();

        if (!resposta.ok || !dados.success) {
          throw new Error(
            dados.error ||
            "Erro ao gerar plano."
          );
        }

        planosPendentes[projeto] = {
          pedido,
          plano: dados.plano,
          resumo: dados.resumo,
          alertas: dados.alertas || []
        };

        const itens =
          Array.isArray(dados.plano)
            ? dados.plano
            : [];

        let html = `
          <strong>🧠 Plano proposto pela IA</strong>
          <p>${escaparHtml(
            dados.resumo || ""
          )}</p>
        `;

        if (!itens.length) {
          html += `
            <p>
              Nenhuma alteracao e necessaria.
            </p>
          `;
        } else {
          html += `
            <div style="display:grid;gap:10px;margin-top:12px;">
          `;

          for (const item of itens) {
            html += `
              <div
                style="
                  padding:12px;
                  border:1px solid #334155;
                  border-radius:10px;
                  background:#111827;
                "
              >
                <strong>
                  ${escaparHtml(
                    String(item.tipo).toUpperCase()
                  )}
                  —
                  ${escaparHtml(item.path)}
                </strong>

                <div
                  class="muted"
                  style="margin-top:6px;"
                >
                  ${escaparHtml(
                    item.motivo || ""
                  )}
                </div>
              </div>
            `;
          }

          html += `</div>`;
        }

        if (
          Array.isArray(dados.alertas) &&
          dados.alertas.length
        ) {
          html += `
            <div
              style="
                margin-top:12px;
                padding:12px;
                border:1px solid #f59e0b;
                border-radius:10px;
              "
            >
              <strong>⚠️ Alertas</strong>
              <ul>
                ${dados.alertas.map(
                  alerta =>
                    `<li>${escaparHtml(alerta)}</li>`
                ).join("")}
              </ul>
            </div>
          `;
        }

        planoConteudo.innerHTML = html;

        planoContainer.style.display =
          "block";

        const botaoAprovar =
          document.getElementById(
            `aprovar-plano-${projeto}`
          );

        if (botaoAprovar) {
          botaoAprovar.disabled =
            itens.length === 0;
        }

        resultado.innerHTML =
          "✅ Plano gerado. Revise antes de aplicar.";

      } catch (erro) {
        resultado.innerHTML =
          "❌ Nao foi possivel gerar o plano: " +
          escaparHtml(erro.message);
      }
    }


    async function aprovarPlanoIA(projeto) {
      const pendente =
        planosPendentes[projeto];

      if (
        !pendente ||
        !Array.isArray(pendente.plano)
      ) {
        alert(
          "Nenhum plano pendente para aprovar."
        );
        return;
      }

      if (houveAlteracao(projeto)) {
        alert(
          "Existe um arquivo com alteracoes nao salvas. Salve ou desfaça antes de aplicar o plano."
        );
        return;
      }

      const confirmar =
        window.confirm(
          `Aplicar o plano aprovado no projeto "${projeto}"?\n\nUm backup sera criado antes das alteracoes.`
        );

      if (!confirmar) {
        return;
      }

      const resultado =
        document.getElementById(
          `resultado-${projeto}`
        );

      const botao =
        document.getElementById(
          `aprovar-plano-${projeto}`
        );

      if (botao) {
        botao.disabled = true;
      }

      resultado.innerHTML =
        "⚙️ Aplicando plano aprovado...";

      try {
        const resposta =
          await fetch(
            "/api/edit/apply",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body: JSON.stringify({
                projeto,
                pedido:
                  pendente.pedido,
                plano:
                  pendente.plano
              })
            }
          );

        const dados =
          await resposta.json();

        if (!resposta.ok || !dados.success) {
          throw new Error(
            dados.error ||
            "Erro ao aplicar o plano."
          );
        }

        resultado.innerHTML = `
          <div class="success-box">
            <strong>
              ✅ Plano aplicado com sucesso!
            </strong>

            <p>
              ${escaparHtml(
                dados.answer || ""
              )}
            </p>

            <p>
              Operacoes:
              <strong>
                ${dados.quantidadeOperacoes}
              </strong>
            </p>

            <p>
              Backup:
              <strong>
                ${escaparHtml(
                  dados.backup || "nenhum"
                )}
              </strong>
            </p>
          </div>
        `;

        delete planosPendentes[projeto];

        const planoContainer =
          document.getElementById(
            `plano-container-${projeto}`
          );

        if (planoContainer) {
          planoContainer.style.display =
            "none";
        }

        await carregarArquivos(projeto);

        arquivosAbertos[projeto] = null;
        conteudosOriginais[projeto] = null;

        const codigoContainer =
          document.getElementById(
            `codigo-container-${projeto}`
          );

        if (codigoContainer) {
          codigoContainer.style.display =
            "none";
        }

        atualizarPreview(projeto);

      } catch (erro) {
        resultado.innerHTML =
          "❌ Nao foi possivel aplicar o plano: " +
          escaparHtml(erro.message);

        if (botao) {
          botao.disabled = false;
        }
      }
    }


    function cancelarPlanoIA(projeto) {
      delete planosPendentes[projeto];

      const planoContainer =
        document.getElementById(
          `plano-container-${projeto}`
        );

      const resultado =
        document.getElementById(
          `resultado-${projeto}`
        );

      if (planoContainer) {
        planoContainer.style.display =
          "none";
      }

      if (resultado) {
        resultado.innerHTML =
          "Plano cancelado. Nenhum arquivo foi alterado.";
      }
    }

    async function editarAppExistente(projeto) {
      if (projetoAtivo !== projeto) {
        alert(
          "Este projeto não está ativo no editor. Clique em Abrir editor antes de usar a IA."
        );
        return;
      }

      const pedido =
        document.getElementById(
          `pedido-${projeto}`
        ).value;

      const resultado =
        document.getElementById(
          `resultado-${projeto}`
        );

      if (!pedido.trim()) {
        alert(
          "Descreva a alteração desejada."
        );
        return;
      }

      if (houveAlteracao(projeto)) {
        alert(
          "Existe um arquivo com alterações não salvas. Salve ou desfaça antes de usar a IA."
        );
        return;
      }

      resultado.innerHTML =
        "✨ A inteligência artificial está editando...";

      try {
        const resposta =
          await fetch("/api/edit", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              projeto,
              pedido
            })
          });

        const dados =
          await resposta.json();

        if (!resposta.ok || !dados.success) {
          throw new Error(
            dados.error ||
            "Erro ao editar."
          );
        }

        resultado.innerHTML = `
          <div class="success-box">

            <strong>
              ✅ Alteração concluída!
            </strong>

            <p>
              ${dados.answer}
            </p>

            <p>
              Backup criado:
              <strong>
                ${dados.backup || "sim"}
              </strong>
            </p>

          </div>
        `;

        atualizarPreview(projeto);

        await carregarArquivos(projeto);

        if (arquivosAbertos[projeto]) {
          const arquivoAtual =
            arquivosAbertos[projeto];

          arquivosAbertos[projeto] = null;
          conteudosOriginais[projeto] = null;

          await abrirArquivo(
            projeto,
            encodeURIComponent(
              arquivoAtual
            )
          );
        }

      } catch (erro) {
        resultado.innerHTML =
          "❌ Não foi possível editar: " +
          erro.message;
      }
    }



    function formatarDataHistoricoIA(data) {
      try {
        return new Date(data)
          .toLocaleString("pt-BR");
      } catch {
        return data || "";
      }
    }


    async function carregarHistoricoIA(projeto) {
      const area =
        document.getElementById(
          `historico-ia-${projeto}`
        );

      if (!area) {
        return;
      }

      /*
        Se ja estiver aberto,
        o mesmo botao fecha.
      */
      if (
        area.dataset.aberto === "sim"
      ) {
        area.innerHTML = "";
        area.dataset.aberto = "nao";
        return;
      }

      area.dataset.aberto = "sim";

      area.innerHTML = `
        <div class="panel history-area">
          🤖 Carregando Histórico da IA...
        </div>
      `;

      try {
        const resposta =
          await fetch(
            `/api/apps/${projeto}/ai-history`
          );

        const dados =
          await resposta.json();

        if (!resposta.ok || !dados.success) {
          throw new Error(
            dados.error ||
            "Erro ao carregar Histórico da IA."
          );
        }

        const registros =
          Array.isArray(dados.registros)
            ? dados.registros
            : [];

        if (!registros.length) {
          area.innerHTML = `
            <div class="panel history-area">
              <h3>🤖 Histórico da IA</h3>

              <p class="muted">
                Nenhum registro de IA encontrado neste projeto.
              </p>
            </div>
          `;
          return;
        }

        let html = `
          <div class="panel history-area">

            <h3>
              🤖 Histórico da IA — ${escaparHtml(projeto)}
            </h3>

            <p class="muted">
              ${registros.length}
              registro(s) encontrado(s).
            </p>

            <div
              style="
                display:grid;
                gap:12px;
                margin-top:14px;
              "
            >
        `;

        for (const registro of registros) {

          const tipo =
            registro.tipo ||
            "registro";

          const tituloTipo =
            tipo === "plano_aplicado"
              ? "✅ Plano aplicado"
              : tipo === "plano_gerado"
                ? "🧠 Plano gerado"
                : "🤖 Registro da IA";

          html += `
            <div class="history-card">

              <div
                style="
                  display:flex;
                  justify-content:space-between;
                  gap:10px;
                  flex-wrap:wrap;
                "
              >
                <strong>
                  ${tituloTipo}
                </strong>

                <span class="muted">
                  ${escaparHtml(
                    formatarDataHistoricoIA(
                      registro.data
                    )
                  )}
                </span>
              </div>
          `;

          if (registro.pedido) {
            html += `
              <div style="margin-top:10px;">
                <strong>Pedido:</strong>
                <div class="muted">
                  ${escaparHtml(
                    registro.pedido
                  )}
                </div>
              </div>
            `;
          }

          if (registro.resumo) {
            html += `
              <div style="margin-top:10px;">
                <strong>Resumo:</strong>
                <div class="muted">
                  ${escaparHtml(
                    registro.resumo
                  )}
                </div>
              </div>
            `;
          }

          const plano =
            registro.plano ||
            registro.planoAprovado;

          if (
            Array.isArray(plano) &&
            plano.length
          ) {
            html += `
              <div style="margin-top:10px;">
                <strong>Plano:</strong>

                <ul>
                  ${plano.map(item => `
                    <li>
                      <strong>
                        ${escaparHtml(
                          String(
                            item.tipo || ""
                          ).toUpperCase()
                        )}
                      </strong>
                      —
                      ${escaparHtml(
                        item.path || ""
                      )}

                      ${
                        item.motivo
                          ? `<div class="muted">
                              ${escaparHtml(
                                item.motivo
                              )}
                            </div>`
                          : ""
                      }
                    </li>
                  `).join("")}
                </ul>
              </div>
            `;
          }

          if (
            Array.isArray(
              registro.operacoes
            ) &&
            registro.operacoes.length
          ) {
            html += `
              <div style="margin-top:10px;">
                <strong>
                  Operações executadas:
                </strong>

                <ul>
                  ${registro.operacoes.map(
                    item => `
                      <li>
                        ${escaparHtml(
                          String(
                            item.tipo || ""
                          ).toUpperCase()
                        )}
                        —
                        ${escaparHtml(
                          item.path || ""
                        )}
                      </li>
                    `
                  ).join("")}
                </ul>
              </div>
            `;
          }

          if (registro.backup) {
            html += `
              <div style="margin-top:10px;">
                <strong>Backup:</strong>
                <code>
                  ${escaparHtml(
                    registro.backup
                  )}
                </code>
              </div>
            `;
          }

          html += `</div>`;
        }

        html += `
            </div>
          </div>
        `;

        area.innerHTML = html;

      } catch (erro) {
        area.innerHTML = `
          <div class="panel history-area">
            <span class="error">
              ❌ Não foi possível carregar o Histórico da IA:
              ${escaparHtml(
                erro.message
              )}
            </span>
          </div>
        `;
      }
    }

    async function carregarHistorico(projeto) {
      const area =
        document.getElementById(
          `historico-${projeto}`
        );

      if (!area) {
        return;
      }

      area.innerHTML =
        "\u{1F558} Carregando hist\u00F3rico de vers\u00F5es...";

      try {
        const resposta =
          await fetch(
            `/api/apps/${projeto}/versions`
          );

        const dados =
          await resposta.json();

        if (!resposta.ok || !dados.success) {
          throw new Error(
            dados.error ||
            "Erro ao carregar histórico."
          );
        }

        if (!dados.versoes.length) {
          area.innerHTML = `
            <p class="muted">
              Nenhuma versão anterior encontrada.
            </p>
          `;
          return;
        }

        area.innerHTML = `
          <div class="history-area">

            <h3>
              🕘 Histórico de versões
            </h3>

            ${dados.versoes.map(versao => `
              <div class="history-card">

                <strong>
                  ${versao}
                </strong>

                <div class="app-actions">

                  <button
                    onclick="visualizarVersao(
                      '${projeto}',
                      '${versao}'
                    )"
                  >
                    👁 Visualizar versão
                  </button>

                  <button
                    onclick="restaurarVersao(
                      '${projeto}',
                      '${versao}'
                    )"
                    style="background:#dc2626;"
                  >
                    ↩ Restaurar versão
                  </button>

                </div>

              </div>
            `).join("")}

          </div>
        `;

      } catch (erro) {
        area.innerHTML =
          "❌ Não foi possível carregar o histórico: " +
          erro.message;
      }
    }


    async function visualizarVersao(
      projeto,
      versao
    ) {
      try {
        const resposta =
          await fetch(
            `/api/apps/${projeto}/versions/${versao}`
          );

        const dados =
          await resposta.json();

        if (!resposta.ok || !dados.success) {
          throw new Error(
            dados.error ||
            "Erro ao visualizar versão."
          );
        }

        const index =
          dados.arquivos.find(
            arquivo =>
              arquivo.path === "index.html"
          );

        if (!index) {
          throw new Error(
            "Essa versão não possui index.html."
          );
        }

        const css =
          dados.arquivos.find(
            arquivo =>
              arquivo.path === "style.css"
          );

        const js =
          dados.arquivos.find(
            arquivo =>
              arquivo.path === "script.js"
          );

        let html =
          index.content;

        if (css) {
          html =
            html.replace(
              "</head>",
              `<style>${css.content}</style></head>`
            );
        }

        if (js) {
          html =
            html.replace(
              "</body>",
              `<script>${js.content}<\\/script></body>`
            );
        }

        const janela =
          window.open(
            "",
            "_blank"
          );

        if (!janela) {
          alert(
            "O navegador bloqueou a abertura da versão."
          );
          return;
        }

        janela.document.open();
        janela.document.write(html);
        janela.document.close();

      } catch (erro) {
        alert(
          "❌ Não foi possível visualizar a versão: " +
          erro.message
        );
      }
    }


    async function restaurarVersao(
      projeto,
      versao
    ) {
      if (houveAlteracao(projeto)) {
        alert(
          "Existe uma alteração manual não salva. Salve ou desfaça antes de restaurar."
        );
        return;
      }

      const confirmar =
        window.confirm(
          `Deseja restaurar a versão ${versao}?\n\nA versão atual será salva automaticamente antes da restauração.`
        );

      if (!confirmar) {
        return;
      }

      try {
        const resposta =
          await fetch(
            `/api/apps/${projeto}/versions/${versao}/restore`,
            {
              method: "POST"
            }
          );

        const dados =
          await resposta.json();

        if (!resposta.ok || !dados.success) {
          throw new Error(
            dados.error ||
            "Erro ao restaurar versão."
          );
        }

        arquivosAbertos[projeto] = null;
        conteudosOriginais[projeto] = null;

        atualizarPreview(projeto);

        await carregarArquivos(projeto);
        await carregarHistorico(projeto);

        alert(
          `✅ Versão restaurada com sucesso.\n\nVersão: ${dados.versaoRestaurada}\nBackup anterior: ${dados.backupAnterior}`
        );

      } catch (erro) {
        alert(
          "❌ Não foi possível restaurar a versão: " +
          erro.message
        );
      }
    }


    document.addEventListener(
      "keydown",
      function(event) {
        if (
          (event.ctrlKey || event.metaKey) &&
          event.key.toLowerCase() === "s"
        ) {
          const elemento =
            document.activeElement;

          if (
            elemento &&
            elemento.classList &&
            elemento.classList.contains(
              "code-editor"
            )
          ) {
            event.preventDefault();

            const id =
              elemento.id;

            const projeto =
              id.replace(
                "codigo-",
                ""
              );

            salvarArquivo(projeto);
          }
        }
      }
    );


    carregarApps();

  </script>
