<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AppABUOA AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #ffffff;
    }

    .container {
      max-width: 1500px;
      margin: 0 auto;
      padding: 36px 20px 60px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 48px;
      text-align: center;
    }

    .subtitulo {
      margin-bottom: 36px;
      text-align: center;
      color: #94a3b8;
      font-size: 20px;
    }

    .creator {
      max-width: 1000px;
      margin: 0 auto;
      padding: 25px;
      background: #1e293b;
      border-radius: 16px;
      text-align: center;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      padding: 18px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #0f172a;
      color: #ffffff;
      font-size: 16px;
      resize: vertical;
    }

    button {
      margin-top: 14px;
      padding: 12px 20px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #resultado {
      display: none;
      margin-top: 22px;
      padding: 18px;
      border-radius: 10px;
      background: #0f172a;
      text-align: left;
    }

    #meusApps {
      margin-top: 38px;
    }

    .app-card {
      margin-bottom: 20px;
      padding: 18px;
      border: 1px solid #334155;
      border-radius: 14px;
      background: #1e293b;
    }

    .app-title {
      font-size: 19px;
      font-weight: bold;
    }

    .app-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .app-card.active-project {
      border-color: #22c55e;
      box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.35);
    }

    .active-project-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
      margin-bottom: 4px;
      padding: 12px 14px;
      border: 1px solid #22c55e;
      border-radius: 10px;
      background: rgba(20, 83, 45, 0.65);
      color: #dcfce7;
      font-weight: bold;
    }

    .active-project-banner .project-name {
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .active-project-banner button {
      margin: 0;
      padding: 8px 12px;
      background: #475569;
      font-size: 13px;
    }

    .workspace {
      display: grid;
      grid-template-columns: 470px 1fr;
      gap: 18px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #334155;
      align-items: start;
    }

    .left-column {
      display: grid;
      gap: 16px;
    }

    .panel {
      padding: 16px;
      border: 1px solid #334155;
      border-radius: 14px;
      background: #0f172a;
    }

    .panel h3 {
      margin-top: 0;
    }

    .muted {
      color: #94a3b8;
    }

    .editor-status {
      margin-top: 15px;
      color: #cbd5e1;
    }

    .preview-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .preview-toolbar button {
      margin-top: 0;
      padding: 10px 14px;
      font-size: 14px;
    }

    .preview-box {
      min-height: 680px;
      padding: 12px;
      overflow: auto;
      border: 1px solid #334155;
      border-radius: 12px;
      background: #020617;
    }

    .preview-frame-wrap {
      width: 100%;
      margin: 0 auto;
      transition: width 0.2s ease;
    }

    .preview-frame {
      display: block;
      width: 100%;
      height: 650px;
      border: 0;
      border-radius: 8px;
      background: #ffffff;
    }

    .new-file-box {
      margin: 14px 0 12px;
      padding: 12px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #111827;
    }

    .new-file-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .new-file-row input {
      flex: 1;
      min-width: 190px;
      padding: 10px 12px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #020617;
      color: #ffffff;
    }

    .new-file-row button {
      margin-top: 0;
      background: #2563eb;
    }

    .new-file-status {
      margin-top: 9px;
      min-height: 18px;
      font-size: 13px;
    }

    .files-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .file-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 7px;
      align-items: stretch;
    }

    .file-row .file-button {
      min-width: 0;
    }

    .file-action {
      margin: 0;
      padding: 10px 12px;
      min-width: 44px;
    }

    .file-button {
      width: 100%;
      margin: 0;
      padding: 11px 12px;
      text-align: left;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
    }

    .file-button:hover {
      background: #334155;
    }

    .file-button.active {
      border-color: #3b82f6;
      background: #1d4ed8;
    }

    .code-panel {
      margin-top: 14px;
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }

    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .search-row input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #020617;
      color: #fff;
    }

    .search-row button {
      margin-top: 0;
      padding: 10px 14px;
    }

    .code-editor-wrapper {
      display: grid;
      grid-template-columns: auto 1fr;
      min-height: 430px;
      max-height: 620px;
      overflow: hidden;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #020617;
    }

    .line-numbers {
      min-width: 48px;
      padding: 14px 10px;
      overflow: hidden;
      border-right: 1px solid #334155;
      background: #111827;
      color: #64748b;
      text-align: right;
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
      line-height: 1.5;
      user-select: none;
      white-space: pre;
    }

    .code-editor {
      width: 100%;
      min-height: 430px;
      max-height: 620px;
      margin: 0;
      padding: 14px;
      overflow: auto;
      border: 0;
      outline: none;
      border-radius: 0;
      background: #020617;
      color: #e2e8f0;
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
      line-height: 1.5;
      resize: vertical;
      tab-size: 2;
      white-space: pre;
    }

    .code-editor:focus {
      box-shadow: inset 0 0 0 1px #3b82f6;
    }

    .save-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .save-actions button {
      margin-top: 0;
    }

    .file-status {
      margin-top: 12px;
      min-height: 20px;
      font-size: 14px;
    }

    .unsaved {
      color: #fbbf24;
      font-weight: bold;
    }

    .saved {
      color: #4ade80;
      font-weight: bold;
    }

    .error {
      color: #f87171;
      font-weight: bold;
    }

    .history-area {
      margin-top: 18px;
    }

    .history-card {
      margin-top: 10px;
      padding: 14px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #0f172a;
    }

    .success-box {
      margin-top: 15px;
      margin-bottom: 15px;
      padding: 18px;
      border: 1px solid #22c55e;
      border-radius: 10px;
      background: #14532d;
    }

    @media (max-width: 1100px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .preview-box {
        min-height: 560px;
      }

      .preview-frame {
        height: 540px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>AppABUOA AI</h1>

    <div class="subtitulo">
      Transforme suas ideias em aplicativos com inteligÃªncia artificial.
    </div>

    <div class="creator">

      <textarea
        id="prompt"
        placeholder="Descreva o aplicativo que vocÃª deseja criar..."
      ></textarea>

      <button onclick="criarApp()">
        Criar com IA
      </button>

      <div id="resultado"></div>

    </div>

    <div id="meusApps"></div>

  </div>

  <script>

    const arquivosAbertos = {};
    const conteudosOriginais = {};
    let projetoAtivo = null;


    async function criarApp() {
      const prompt =
        document.getElementById("prompt").value;

      const resultado =
        document.getElementById("resultado");

      if (!prompt.trim()) {
        alert("Descreva primeiro o aplicativo que deseja criar.");
        return;
      }

      resultado.style.display = "block";
      resultado.textContent =
        "âœ¨ A inteligÃªncia artificial estÃ¡ trabalhando...";

      try {
        const resposta = await fetch("/api/ai", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ prompt })
        });

        const dados = await resposta.json();

        if (!resposta.ok || !dados.success) {
          throw new Error(
            dados.error || "Erro ao consultar a IA."
          );
        }

        resultado.innerHTML = `
          <strong>âœ… Aplicativo criado com sucesso.</strong>
          <p>${dados.answer}</p>
          <p>
            Projeto:
            <strong>${dados.projeto}</strong>
          </p>
        `;

        await carregarApps();

      } catch (erro) {
        resultado.textContent =
          "âŒ NÃ£o foi possÃ­vel gerar o aplicativo: " +
          erro.message;
      }
    }



    async function duplicarProjetoInterface(projeto) {
      if (
        projetoAtivo &&
        projetoAtivo !== projeto &&
        existeAlteracaoNaoSalvaNoProjeto(projetoAtivo)
      ) {
        alert(
          "Existe outro projeto com alterações não salvas. Salve ou desfaça antes de duplicar."
        );
        return;
      }

      if (
        projetoAtivo === projeto &&
        existeAlteracaoNaoSalvaNoProjeto(projeto)
      ) {
        alert(
          "Este projeto possui alterações não salvas. Salve ou desfaça antes de duplicar."
        );
        return;
      }

      const novoNome =
        window.prompt(
          "Digite o nome do novo projeto:",
          projeto + "-copia"
        );

      if (
        novoNome === null ||
        !novoNome.trim()
      ) {
        return;
      }

      try {
        const resposta =
          await fetch(
            `/api/apps/${projeto}/duplicate`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                novoNome:
                  novoNome.trim()
              })
            }
          );

        const dados =
          await resposta.json();

        if (!resposta.ok || !dados.success) {
          throw new Error(
            dados.error ||
            "Erro ao duplicar projeto."
          );
        }

        alert(
          `✅ Projeto duplicado com sucesso.\n\nOriginal: ${dados.projetoOriginal}\nNova cópia: ${dados.projeto}\nArquivos copiados: ${dados.quantidadeArquivos}`
        );

        await carregarApps();

      } catch (erro) {
        alert(
          "❌ Não foi possível duplicar o projeto: " +
          erro.message
        );
      }
    }


    async function renomearProjetoInterface(projeto) {
      if (
        projetoAtivo === projeto &&
        existeAlteracaoNaoSalvaNoProjeto(projeto)
      ) {
        alert(
          "Este projeto possui alterações não salvas. Salve ou desfaça antes de renomear."
        );
        return;
      }

      const novoNome =
        window.prompt(
          "Digite o novo nome do projeto:",
          projeto
        );

      if (
        novoNome === null ||
        !novoNome.trim() ||
        novoNome.trim() === projeto
      ) {
        return;
      }

      try {
        const resposta =
          await fetch(
            `/api/apps/${projeto}/rename`,
            {
              method: "PATCH",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                novoNome:
                  novoNome.trim()
              })
            }
          );

        const dados =
          await resposta.json();

        if (!resposta.ok || !dados.success) {
          throw new Error(
            dados.error ||
            "Erro ao renomear projeto."
          );
        }

        if (projetoAtivo === projeto) {
          projetoAtivo = null;
        }

        alert(
          `✅ Projeto renomeado com sucesso.\n\nAnterior: ${dados.projetoAnterior}\nNovo nome: ${dados.projeto}\nArquivos: ${dados.quantidadeArquivos}`
        );

        await carregarApps();

      } catch (erro) {
        alert(
          "❌ Não foi possível renomear o projeto: " +
          erro.message
        );
      }
    }

    function visualizarApp(projeto) {
      window.open(
        `/apps/${projeto}/`,
        "_blank"
      );
    }


    async function carregarApps() {
      const area =
        document.getElementById("meusApps");

      try {
        const resposta =
          await fetch("/api/apps");

        const dados =
          await resposta.json();

        if (!resposta.ok || !dados.success) {
          throw new Error(
            dados.error ||
            "NÃ£o foi possÃ­vel carregar os aplicativos."
          );
        }

        if (!dados.apps.length) {
          area.innerHTML = "";
          return;
        }

        area.innerHTML = `
          <h2>Meus Aplicativos</h2>

          ${dados.apps.map(app => `
            <div class="app-card" id="app-card-${app.nome}">

              <div class="app-title">
                ${app.nome}
              </div>

              <div class="app-actions">

                <button
                  onclick="abrirWorkspace('${app.nome}')"
                >
                  🧩 Abrir editor
                </button>

                <button
                  onclick="visualizarApp('${app.nome}')"
                  style="background:#16a34a;"
                >
                  ↗ Abrir em nova aba
                </button>

                <button
                  onclick="carregarHistorico('${app.nome}')"
                  style="background:#0f766e;"
                >
                  🕘 Histórico de versões
                </button>
                <button
                  onclick="duplicarProjetoInterface('${app.nome}')"
                  style="background:#d97706;"
                >
                  &#128209; Duplicar projeto
                </button>
                <button
                  onclick="renomearProjetoInterface('${app.nome}')"
                  style="background:#2563eb;"
                >
                  ✏️ Renomear projeto
                </button>

              </div>

              <div id="workspace-${app.nome}"></div>
              <div id="historico-${app.nome}"></div>

            </div>
          `).join("")}
        `;

      } catch (erro) {
        area.innerHTML =
          "âŒ NÃ£o foi possÃ­vel carregar os aplicativos: " +
          erro.message;
      }
    }


    function existeAlteracaoNaoSalvaNoProjeto(projeto) {
      if (!projeto) {
        return false;
      }

      const codigo =
        document.getElementById(
          `codigo-${projeto}`
        );

      if (!codigo) {
        return false;
      }

      return (
        arquivosAbertos[projeto] &&
        codigo.value !==
          conteudosOriginais[projeto]
      );
    }


    function fecharWorkspace(projeto) {
      if (!projeto) {
        return;
      }

      const area =
        document.getElementById(
          `workspace-${projeto}`
        );

      if (area) {
        area.innerHTML = "";
      }

      const card =
        document.getElementById(
          `app-card-${projeto}`
        );

      if (card) {
        card.classList.remove(
          "active-project"
        );
      }

      if (projetoAtivo === projeto) {
        projetoAtivo = null;
      }
    }


    function fecharProjetoAtivo() {
      if (!projetoAtivo) {
        return;
      }

      if (
        existeAlteracaoNaoSalvaNoProjeto(
          projetoAtivo
        )
      ) {
        alert(
          "Existe um arquivo com alteraÃ§Ãµes nÃ£o salvas. Salve ou desfaÃ§a antes de fechar o editor."
        );
        return;
      }

      fecharWorkspace(projetoAtivo);
    }


    function abrirWorkspace(projeto) {
      if (
        projetoAtivo &&
        projetoAtivo !== projeto
      ) {
        if (
          existeAlteracaoNaoSalvaNoProjeto(
            projetoAtivo
          )
        ) {
          alert(
            `O projeto ${projetoAtivo} possui alteraÃ§Ãµes nÃ£o salvas.\n\nSalve ou desfaÃ§a essas alteraÃ§Ãµes antes de abrir outro projeto.`
          );
          return;
        }

        fecharWorkspace(
          projetoAtivo
        );
      }

      const area =
        document.getElementById(
          `workspace-${projeto}`
        );

      if (!area) {
        return;
      }

      projetoAtivo = projeto;

      document
        .querySelectorAll(
          ".app-card.active-project"
        )
        .forEach(card => {
          card.classList.remove(
            "active-project"
          );
        });

      const card =
        document.getElementById(
          `app-card-${projeto}`
        );

      if (card) {
        card.classList.add(
          "active-project"
        );
      }

      area.innerHTML = `
        <div class="active-project-banner">
          <span>
            ðŸŸ¢ EDITANDO AGORA:
            <span class="project-name">
              ${projeto}
            </span>
          </span>

          <button
            onclick="fecharProjetoAtivo()"
            title="Fechar editor deste projeto"
          >
            âœ• Fechar editor
          </button>
        </div>

        <div class="workspace">

          <div class="left-column">

            <div class="panel">

              <h3>
                âœ¨ Editor com IA â€” ${projeto}
              </h3>

              <p class="muted">
                Descreva o que deseja alterar neste aplicativo.
              </p>

              <textarea
                id="pedido-${projeto}"
                placeholder="Exemplo: adicione login, troque as cores, crie uma tela de cadastro..."
              ></textarea>

              <button
                onclick="editarAppExistente('${projeto}')"
                style="background:#7c3aed;"
              >
                âœ¨ Aplicar alteraÃ§Ã£o
              </button>

              <div
                id="resultado-${projeto}"
                class="editor-status"
              ></div>

            </div>


            <div class="panel">

              <h3>
                ðŸ“ Arquivos do projeto â€” ${projeto}
              </h3>

              <p class="muted">
                Clique em um arquivo para abrir e editar.
              </p>

              <div class="new-file-box">
                <div class="new-file-row">
                  <input
                    id="novo-arquivo-${projeto}"
                    type="text"
                    placeholder="Ex.: login.html ou js/config.js"
                    onkeydown="
                      if(event.key === 'Enter') {
                        criarNovoArquivo('${projeto}');
                      }
                    "
                  >
                  <button onclick="criarNovoArquivo('${projeto}')">
                    âž• Novo arquivo
                  </button>
                </div>
                <div
                  id="novo-arquivo-status-${projeto}"
                  class="new-file-status"
                ></div>
              </div>

              <div
                id="arquivos-${projeto}"
                class="files-list"
              >
                Carregando arquivos...
              </div>

              <div
                id="codigo-container-${projeto}"
                class="code-panel"
                style="display:none;"
              >

                <div class="code-header">

                  <strong
                    id="codigo-nome-${projeto}"
                  ></strong>

                  <span
                    id="alteracao-${projeto}"
                  ></span>

                </div>

                <div class="search-row">

                  <input
                    id="buscar-${projeto}"
                    type="text"
                    placeholder="Buscar no cÃ³digo..."
                    onkeydown="
                      if(event.key === 'Enter') {
                        buscarNoCodigo('${projeto}');
                      }
                    "
                  >

                  <button
                    onclick="buscarNoCodigo('${projeto}')"
                    style="background:#475569;"
                  >
                    ðŸ”Ž Buscar
                  </button>

                </div>

                <div class="code-editor-wrapper">

                  <div
                    id="linhas-${projeto}"
                    class="line-numbers"
                  ></div>

                  <textarea
                    id="codigo-${projeto}"
                    class="code-editor"
                    spellcheck="false"
                    oninput="
                      atualizarLinhas('${projeto}');
                      marcarAlteracao('${projeto}');
                    "
                    onscroll="sincronizarScroll('${projeto}')"
                  ></textarea>

                </div>

                <div class="save-actions">

                  <button
                    id="salvar-${projeto}"
                    onclick="salvarArquivo('${projeto}')"
                    style="background:#16a34a;"
                  >
                    ðŸ’¾ Salvar arquivo
                  </button>

                  <button
                    onclick="desfazerAlteracao('${projeto}')"
                    style="background:#475569;"
                  >
                    â†© Desfazer alteraÃ§Ãµes
                  </button>

                  <button
                    onclick="atualizarPreview('${projeto}')"
                    style="background:#0f766e;"
                  >
                    ðŸ”„ Atualizar Preview
                  </button>

                </div>

                <div
                  id="status-arquivo-${projeto}"
                  class="file-status"
                ></div>

              </div>

            </div>

          </div>


          <div class="panel">

            <h3>
              ðŸ‘ Preview â€” ${projeto}
            </h3>

            <div class="preview-toolbar">

              <button
                onclick="mudarPreview('${projeto}', 'desktop')"
              >
                ðŸ–¥ Desktop
              </button>

              <button

    async function renomearArquivo(
      projeto,
      caminhoCodificado
    ) {
      const caminhoAtual =
        decodeURIComponent(
          caminhoCodificado
        );

      if (caminhoAtual === "index.html") {
        alert(
          "O index.html Ã© protegido e nÃ£o pode ser renomeado."
        );
        return;
      }

      if (houveAlteracao(projeto)) {
        alert(
          "Existe um arquivo com alteraÃ§Ãµes nÃ£o salvas. Salve ou desfaÃ§a antes de renomear."
        );
        return;
      }

      const novoCaminho =
        window.prompt(
          "Digite o novo nome ou caminho do arquivo:",
          caminhoAtual
        );

      if (
        novoCaminho === null ||
        !novoCaminho.trim() ||
        novoCaminho.trim() === caminhoAtual
      ) {
        return;
      }

      try {
        const resposta =
          await fetch(
            `/api/apps/${projeto}/file`,
            {
              method: "PATCH",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                path: caminhoAtual,
                newPath: novoCaminho.trim()
              })
            }
          );

        const dados =
          await resposta.json();

        if (!resposta.ok || !dados.success) {
          throw new Error(
            dados.error ||
            "Erro ao renomear arquivo."
          );
        }

        const estavaAberto =
          arquivosAbertos[projeto] ===
          caminhoAtual;

        await carregarArquivos(projeto);

        if (estavaAberto) {
          arquivosAbertos[projeto] = null;
          conteudosOriginais[projeto] = null;

          await abrirArquivo(
            projeto,
            encodeURIComponent(
              dados.arquivo
            )
          );
        }

        atualizarPreview(projeto);

        alert(
          `âœ… Arquivo renomeado com sucesso.\n\n${dados.arquivoAnterior} â†’ ${dados.arquivo}\nBackup: ${dados.backup}`
        );

      } catch (erro) {
        alert(
          "âŒ NÃ£o foi possÃ­vel renomear: " +
          erro.message
        );
      }
    }

      const texto =
        codigo.value;

      const inicio =
        codigo.selectionEnd || 0;

      let indice =
        texto.indexOf(
          termo,
          inicio
        );

      if (indice === -1) {
        indice =
          texto.indexOf(termo);
      }

      if (indice === -1) {
        alert(
          `NÃ£o encontrei "${termo}" neste arquivo.`
        );
        return;
      }

      codigo.focus();

      codigo.setSelectionRange(
        indice,
        indice + termo.length
      );
    }

          html =
            html.replace(
              "</head>",
              `<style>${css.content}</style></head>`
            );
        }

        if (js) {
          html =
            html.replace(
              "</body>",
              `<script>${js.content}<\\/script></body>`
            );
        }

        const janela =
          window.open(
            "",
            "_blank"
          );

        if (!janela) {
          alert(
            "O navegador bloqueou a abertura da versÃ£o."
          );
          return;
        }

        janela.document.open();
        janela.document.write(html);
        janela.document.close();

      } catch (erro) {
        alert(
          "âŒ NÃ£o foi possÃ­vel visualizar a versÃ£o: " +
          erro.message
        );
      }
    }


    async function restaurarVersao(
      projeto,
      versao
    ) {
      if (houveAlteracao(projeto)) {
        alert(
          "Existe uma alteraÃ§Ã£o manual nÃ£o salva. Salve ou desfaÃ§a antes de restaurar."
        );
        return;
      }

      const confirmar =
        window.confirm(
          `Deseja restaurar a versÃ£o ${versao}?\n\nA versÃ£o atual serÃ¡ salva automaticamente antes da restauraÃ§Ã£o.`
        );

      if (!confirmar) {
        return;
      }

      try {
        const resposta =
          await fetch(
            `/api/apps/${projeto}/versions/${versao}/restore`,
            {
              method: "POST"
            }
          );

        const dados =
          await resposta.json();

        if (!resposta.ok || !dados.success) {
          throw new Error(
            dados.error ||
            "Erro ao restaurar versÃ£o."
          );
        }

        arquivosAbertos[projeto] = null;
        conteudosOriginais[projeto] = null;

        atualizarPreview(projeto);

        await carregarArquivos(projeto);
        await carregarHistorico(projeto);

        alert(
          `âœ… VersÃ£o restaurada com sucesso.\n\nVersÃ£o: ${dados.versaoRestaurada}\nBackup anterior: ${dados.backupAnterior}`
        );

      } catch (erro) {
        alert(
          "âŒ NÃ£o foi possÃ­vel restaurar a versÃ£o: " +
          erro.message
        );
      }
    }


    document.addEventListener(
      "keydown",
      function(event) {
        if (
          (event.ctrlKey || event.metaKey) &&
          event.key.toLowerCase() === "s"
        ) {
          const elemento =
            document.activeElement;

          if (
            elemento &&
            elemento.classList &&
            elemento.classList.contains(
              "code-editor"
            )
          ) {
            event.preventDefault();

            const id =
              elemento.id;

            const projeto =
              id.replace(
                "codigo-",
                ""
              );

            salvarArquivo(projeto);
          }
        }
      }
    );


    carregarApps();

  </script>
